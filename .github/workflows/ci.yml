name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --all-targets

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Deterministic consensus simulation
        run: cargo test consensus::tests::deterministic_simulation_handles_delay_drop_and_byzantine
      - name: Property tests
        run: cargo test account::tests::roundtrip_works

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Conformance vectors (VAL-003)
        run: cargo test conformance_val_003
      - name: Conformance equivocation guards (VOTE-001/VOTE-002)
        run: cargo test rejects_equivocating_
      - name: Conformance certificate validation (VAL-002/FIN-001)
        run: cargo test rejects_malformed_
      - name: Conformance safety simulation (FIN-002/SIM-001)
        run: cargo test deterministic_simulation_handles_delay_drop_and_byzantine
